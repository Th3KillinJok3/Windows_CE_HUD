; ---------------------------------------------------------------------------
; Lark HUD - configuration file
;
; Save as hud.ini in the ROOT of the SD card (or in \Windows\).
; Lines starting with ';' or '#' are comments. Delete the file to go back
; to the defaults: metric units, language taken from the system locale,
; theme saved by the THEME button.
; ---------------------------------------------------------------------------

; units = metric  -> km/h, km, m        (default)
; units = imperial-> mph,  mi, ft
units = metric

; lang = pl | en | de | es | fr | it | ru | nl | pt | cz
; Leave the line out and the language follows the device locale.
; Alphabet is transliterated to ASCII for ru (WinCE has no Cyrillic font here).
lang = en

; theme = 0 | 1 | 2 | 3
;   0 = VERSO     red overlay (Toyota Verso 2017 cluster look) - default
;   1 = CZERWONY  classic dark red
;   2 = AMBER     amber/orange
;   3 = NIEBIESKI blue
; The THEME button writes hud_theme.txt, which wins over this line.
theme = 0
